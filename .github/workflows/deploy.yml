name: Publicar app

on:
  # Publica sola cada vez que se suben cambios
  push:
    branches: [main, claude/workout-tracking-app-vb3x0u]
  # Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar archivos
        run: |
          mkdir _site
          cp -r index.html app.js plan.js styles.css sw.js manifest.webmanifest icons _site/
          echo "{\"v\": \"${GITHUB_SHA}\"}" > _site/version.json
          sed -i "s/__BUILD__/${GITHUB_SHA}/" _site/app.js
          sed -i "s/entreno-v[0-9]*/entreno-${GITHUB_SHA::8}/" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
